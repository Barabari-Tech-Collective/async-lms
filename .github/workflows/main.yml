name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        type: choice
        options:
          - staging
          - production
      deploy_orchestrator:
        description: 'Deploy Orchestrator'
        required: true
        type: boolean
        default: true
      deploy_workers:
        description: 'Deploy Workers'
        required: true
        type: boolean
        default: true
      # deploy_frontend:
      #   description: 'Deploy Frontend'
      #   required: true
      #   type: boolean
      #   default: true

jobs:
  # ── Orchestrator → EC2 (t3.small) ─────────────────────────────────────────────
  deploy-orchestrator:
    if: github.event.inputs.deploy_orchestrator == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Orchestrator to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/lms-be
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            cd backend

            # Setup Redis inside Orchestrator (Idempotent)
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl enable --now docker
              sudo usermod -aG docker ubuntu
            fi

            if ! sudo docker ps | grep -q redis-server; then
              echo "Starting Redis container..."
              sudo docker rm -f redis-server 2>/dev/null || true
              sudo docker run -d --name redis-server -p 6379:6379 --restart unless-stopped redis:alpine
            else
              echo "Redis is already running."
            fi

            # Generate .env file automatically
            echo "PGHOST=${{ secrets.PGHOST }}" > .env
            echo "PGDATABASE=${{ secrets.PGDATABASE }}" >> .env
            echo "PGUSER=${{ secrets.PGUSER }}" >> .env
            echo "PGPASSWORD='${{ secrets.PGPASSWORD }}'" >> .env
            echo "PGPORT=${{ secrets.PGPORT }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
            echo "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" >> .env
            echo "S3_WORKSPACE_BUCKET=${{ secrets.S3_WORKSPACE_BUCKET }}" >> .env
            echo "GOOGLE_AUTH_CLIENT_ID=${{ secrets.GOOGLE_AUTH_CLIENT_ID }}" >> .env
            echo "GOOGLE_AUTH_CLIENT_SECRET=${{ secrets.GOOGLE_AUTH_CLIENT_SECRET }}" >> .env
            echo "GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}" >> .env
            echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env
            echo "ORCHESTRATOR_URL=${{ secrets.ORCHESTRATOR_URL }}" >> .env
            echo "WORKER_CAPACITY=${{ secrets.WORKER_CAPACITY }}" >> .env
            echo "MAX_WORKSPACES=${{ secrets.MAX_WORKSPACES }}" >> .env
            echo "CHATGPT_API_KEY=${{ secrets.CHATGPT_API_KEY }}" >> .env
            echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> .env
            echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> .env
            echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
            echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env
            echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> .env
            echo "SMTP_FROM=${{ secrets.SMTP_FROM }}" >> .env
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
            echo "OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}" >> .env
            echo "OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}" >> .env
            echo "CENTRAL_EVALUATOR_URL=${{ secrets.CENTRAL_EVALUATOR_URL }}" >> .env
            echo "CENTRAL_EVALUATOR_API_KEY=${{ secrets.CENTRAL_EVALUATOR_API_KEY }}" >> .env
            echo "PORT=3001" >> .env

            # Runner pool sizing. This box is memory-constrained and also serves
            # every API request — the library defaults (20/20/5/5 = 50 containers)
            # exhaust it and take the API down with it. Keep these small.
            echo "RUNNER_POOL_SIZE=${{ vars.RUNNER_POOL_SIZE || 2 }}" >> .env
            echo "RUNNER_POOL_SIZE_JAVA=${{ vars.RUNNER_POOL_SIZE_JAVA || 1 }}" >> .env
            echo "RUNNER_POOL_SIZE_SQL=${{ vars.RUNNER_POOL_SIZE_SQL || 0 }}" >> .env

            # The runner pool needs these images present on THIS box. Build only
            # what is missing: rebuilding all four on every deploy saturates the
            # instance. Remove an image by hand to force a rebuild.
            for img in workspace-node workspace-python workspace-java; do
              if ! docker image inspect "$img" > /dev/null 2>&1; then
                echo "Building missing runner image: $img"
                docker build -t "$img" "./docker/$img"
              fi
            done

            npm install

            # Rotate PM2 logs. Without this they grow until the disk fills, and
            # a multi-GB file is not greppable during an incident anyway.
            pm2 install pm2-logrotate || true
            pm2 set pm2-logrotate:max_size 20M
            pm2 set pm2-logrotate:retain 14
            pm2 set pm2-logrotate:compress true

            # Restart ONLY the orchestrator process via ecosystem.config.js
            pm2 start ecosystem.config.js --only codeguru-lms-prod || pm2 restart codeguru-lms-prod --update-env
            pm2 save

            # Fail the deploy loudly if no language can execute code.
            sleep 15
            curl -fsS http://localhost:3001/api/v1/internal/runner/health \
              || echo "::warning::Runner pool has no capacity — exercise run/test will return 503"

  # ── Workers → staging: 1x EC2 (t3.medium/4GB) | production: 5x EC2 (t3.large/8GB) ──
  deploy-workers:
    if: github.event.inputs.deploy_workers == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get ASG Instance IPs
        id: get-ips
        run: |
          # Determine the ASG name based on the environment
          if [ "${{ github.event.inputs.environment }}" == "staging" ]; then
            ASG_NAME="codeguru-staging-worker-ASG"
          else
            ASG_NAME="codeguru-production-worker-ASG"
          fi
          
          echo "Fetching instances for ASG: $ASG_NAME"
          
          # Get instance IDs currently attached to the ASG
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names $ASG_NAME --query "AutoScalingGroups[0].Instances[*].InstanceId" --output text)
          
          if [ -z "$INSTANCE_IDS" ]; then
            echo "No instances found in ASG $ASG_NAME"
            echo "ips=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Get the Public IPs of those instances
          IPS=$(aws ec2 describe-instances --instance-ids $INSTANCE_IDS --query "Reservations[*].Instances[*].PublicIpAddress" --output text | tr '\t' ',' | tr '\n' ',')
          
          # Remove trailing comma
          IPS=${IPS%,}
          echo "Found active ASG IPs: $IPS"
          echo "ips=$IPS" >> $GITHUB_OUTPUT

      - name: Deploy to Worker Node(s)
        # Skip deployment if no workers are running (ASG scaled to 0)
        if: steps.get-ips.outputs.ips != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Dynamically deploy to whatever IPs the ASG currently has running!
          host: ${{ steps.get-ips.outputs.ips }}
          username: ubuntu
          key: ${{ secrets.WORKER_SSH_KEY }}
          script: |
            # Self-healing Swap Setup (Ensures 10GB swap exists for Docker stability)
            if [ ! -f /swapfile ]; then
              echo "No swapfile found. Provisioning 10GB swap space..."
              sudo fallocate -l 10G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            else
              if ! swapon --show | grep -q '/swapfile'; then
                sudo swapon /swapfile
              fi
            fi

            cd /home/ubuntu/lms-be
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            cd backend

            # Generate .env file automatically using the Private IP
            PRIVATE_IP=$(hostname -I | awk '{print $1}')
            echo "WORKER_PORT=4000" > .env
            echo "WORKER_ID=worker-$(hostname)" >> .env
            echo "WORKER_URL=http://$PRIVATE_IP:4000" >> .env
            echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> .env
            echo "ORCHESTRATOR_URL=${{ secrets.ORCHESTRATOR_URL }}" >> .env
            echo "PGHOST=${{ secrets.PGHOST }}" >> .env
            echo "PGDATABASE=${{ secrets.PGDATABASE }}" >> .env
            echo "PGUSER=${{ secrets.PGUSER }}" >> .env
            echo "PGPASSWORD='${{ secrets.PGPASSWORD }}'" >> .env
            echo "PGPORT=${{ secrets.PGPORT }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
            echo "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" >> .env
            echo "GOOGLE_AUTH_CLIENT_ID=${{ secrets.GOOGLE_AUTH_CLIENT_ID }}" >> .env
            echo "GOOGLE_AUTH_CLIENT_SECRET=${{ secrets.GOOGLE_AUTH_CLIENT_SECRET }}" >> .env
            echo "GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}" >> .env
            echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env
            echo "CHATGPT_API_KEY=${{ secrets.CHATGPT_API_KEY }}" >> .env
            echo "WORKER_CAPACITY=${{ secrets.WORKER_CAPACITY }}" >> .env
            echo "MAX_WORKSPACES=${{ secrets.MAX_WORKSPACES }}" >> .env
            echo "S3_WORKSPACE_BUCKET=${{ secrets.S3_WORKSPACE_BUCKET }}" >> .env
            echo "ASG_NAME=c${{ secrets.ASG_NAME }}" >> .env
            
            # Install build tools for native modules like node-pty
            sudo apt-get update -y
            sudo apt-get install -y build-essential python3

            npm install

            echo "Rebuilding workspace images (uses cache if unchanged)..."
            docker build -t workspace-node   ./docker/workspace-node
            docker build -t workspace-python ./docker/workspace-python
            docker build -t workspace-java   ./docker/workspace-java
            docker build -t workspace-sql    ./docker/workspace-sql

            # Fix permissions of existing workspaces that Docker accidentally created as root
            sudo chown -R ubuntu:ubuntu /home/ubuntu/lms-be/backend/workspaces || true

            # Restart ONLY the worker process via ecosystem.config.js
            pm2 start ecosystem.config.js --only worker || pm2 restart worker --update-env

